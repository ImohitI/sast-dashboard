# Joins the network of sast-platform's compose project, so "postgres" and "redis" resolve to its containers.
# Start sast-platform first:  (cd ../sast-platform && docker compose up -d)
services:
  dashboard-api:
    build: ./dashboard-api
    ports: ["8082:8082"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sast
      SPRING_DATA_REDIS_HOST: redis

  ui:
    build: ./ui
    ports: ["4200:80"]
    depends_on: [dashboard-api]

networks:
  default:
    name: sast-platform_default
    external: true
